name: ♿ Accessibility barrier
description: Something in osctl you cannot see, reach, or use
title: "♿ <TITLE>"
labels: ["accessibility"]
body:
  - type: textarea
    id: barrier
    attributes:
      label: What stopped you?
      description: What you tried to do, with which command, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        Your operating system, terminal, color scheme, font size, and any
        assistive technology (screen reader, magnifier, voice control) with its
        version.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would work for you?
      description: Optional. How you expected it to work, or what would help.
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow the [Code of Conduct](https://github.com/jboix/osctl/blob/main/docs/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow the osctl Code of Conduct
          required: true
