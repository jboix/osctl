name: Quality

on:
  merge_group:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".tool-versions"

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: |
          bun install --frozen-lockfile

      - name: Run Biome (format + lint)
        run: |
          bun run lint

      - name: Check Markdown links (remark)
        run: |
          bun run docs:check

      - name: Check architecture boundaries
        run: |
          bun run arch

      - name: Check for dead code and unused dependencies
        run: |
          bun run knip

      - name: Typecheck
        run: |
          bun run typecheck

      - name: Run unit tests with coverage
        run: |
          bun run test:coverage

      - name: Run the rule tests
        run: |
          bun test ./.vibator/

      - name: Build the binary
        run: |
          bun run build

      - name: Run the compiled binary
        run: |
          ./dist/osctl

      - name: Project rules (vibator)
        run: |
          bun run rules

      - name: Test coverage
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          config: .github/octocov.yml

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".tool-versions"

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: |
          bun install --frozen-lockfile

      - name: Lint commit messages (Conventional Commits drive releases)
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" --verbose
